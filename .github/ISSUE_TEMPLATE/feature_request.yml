name: Feature request
description: Suggest an improvement that preserves privacy and evidence boundaries.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Explain the user need without including personal report data.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Include privacy, consent, and evidence-boundary implications.
    validations:
      required: true
